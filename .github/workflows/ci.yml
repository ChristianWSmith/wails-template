name: Build Fyne App

# Builds run only on demand: the release skill dispatches this workflow
# with the version to stamp into the binary, and pull requests build to
# stay validated. Pushes to main/develop do NOT build (a release is one
# dispatch run, not a branch run plus a tag run).
#
# Build/package/artifact steps call the Makefile directly so CI and local
# dev flows are the same commands (see "Commands" in AGENTS.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binary (X.Y.Z)"
        required: true
        type: string
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate version input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version input must be X.Y.Z, got '${{ inputs.version }}'" >&2
            exit 1
          fi

      - name: Stamp version (release builds)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        # Overwrite the committed "dev" placeholder with the release version
        # so the binary knows its own version for the startup update check.
        run: printf 'package main\n\n// version is the release this binary was built from.\nvar version = "%s"\n' "${{ inputs.version }}" > version.go

      - name: Install Fyne Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: make linux-deps

      # Windows runner images don't ship GNU make; all build/package
      # steps below go through the Makefile, so install it up front.
      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make -y

      - name: Vet and Test
        shell: bash
        run: |
          make vet
          make test

      - name: Artifact name
        id: artifact
        shell: bash
        run: echo "name=$(make -s artifact-name)" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        shell: bash
        run: make artifact

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}
